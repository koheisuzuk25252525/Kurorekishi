name: Chronicle
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ChronicleCore:
    path: ..
targets:
  Chronicle:
    type: application
    platform: iOS
    sources:
      - path: ChronicleApp.swift
    dependencies:
      - package: ChronicleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kurorekishi.chronicle
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
schemes:
  Chronicle:
    build:
      targets:
        Chronicle: all
